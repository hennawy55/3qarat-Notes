name: Deploy SmartNote Web to GitHub Pages

on:
  push:
    branches:
      - supabase-migration
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.ar.js'
      - 'styles.css'
      - 'theme.js'
      - 'language.js'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: supabase-migration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare standalone web build
        run: npm run prepare:web

      - name: Disable Jekyll processing
        run: touch web-build/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
